name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          # There are no dependencies to cache, and without a go.sum the
          # cache step warns on every run.
          cache: false

      - name: Verify formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./...

      # The whole point of the project: the dependency list stays empty.
      - name: Verify no third-party dependencies
        run: |
          if grep -q '^require' go.mod; then
            echo "go.mod gained a dependency; muelle is meant to be stdlib-only"
            exit 1
          fi

  cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          # There are no dependencies to cache, and without a go.sum the
          # cache step warns on every run.
          cache: false
      - name: Build for linux/amd64 and linux/arm64
        run: |
          GOOS=linux GOARCH=amd64 go build ./...
          GOOS=linux GOARCH=arm64 go build ./...
